<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" href="assets/img/favicon-granja.png">

    <title>Fórmulas - Desempenho Zootécnico</title>

    <script>
        (() => {
            const saved =
                localStorage.getItem(
                    "bi-zootecnico-theme"
                );

            if (saved) {
                document.documentElement.dataset.theme =
                    saved;
            }
        })();
    </script>

    <link
        rel="stylesheet"
        href="assets/css/app.css?v=7.14"
    >
    <link rel="stylesheet" href="assets/vendor/geist/index.css">
</head>

<body data-page="formulas">

<div class="app-shell">

    <header class="page-header">
        <div>
            <a
                href="index.html"
                class="back-link"
            >
                ← Desempenho Zootécnico
            </a>

            <div class="eyebrow">
                Catálogo de métricas
            </div>

            <h1>Fórmulas</h1>

            <p>
                Definições oficiais utilizadas no dashboard.
            </p>
        </div>

        <div class="header-toolbar">
            <button
                class="icon-button"
                type="button"
                data-theme-toggle
                aria-label="Alternar tema"
            >
                <span data-theme-icon>☾</span>
            </button>
        </div>
    </header>


    <section class="formula-page-section" id="desempenho">
        <div class="formula-section-header">
            <h2>Desempenho Zootécnico</h2>
            <p>Métricas da base dinâmica de lotes abatidos.</p>
        </div>
        <div id="formulaContainer" class="formula-grid"></div>
    </section>

    <section class="formula-page-section" id="lotes-em-criacao">
        <div class="formula-section-header">
            <h2>Lotes em Criação</h2>
            <p>Métricas dos lotes abertos no snapshot mais recente, limitados a 45 dias.</p>
        </div>
        <div id="formulaLotesContainer" class="formula-grid"></div>
    </section>

</div>


<script src="assets/js/config.js?v=7.6"></script>
<script src="assets/js/metrics.js?v=7.6"></script>
<script src="assets/js/lotes-formulas.js?v=7.8"></script>
<script src="assets/js/theme.js?v=7.6"></script>
<script src="assets/js/formulas.js?v=7.8"></script>

<script src="assets/js/sidebar.js?v=7.14"></script>
</body>
</html>
